name: Render and Deploy Presentation

on:
  push:
    branches: main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Install and cache R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rmarkdown
            any::xaringan
            any::xaringanExtra
            any::xaringanthemer
            any::knitr
            any::tidyverse
            any::ggplot2
            any::dplyr
            any::tidyr
            any::readr
            any::readxl
            any::stringr
            any::purrr
            any::tibble
            any::showtext
            any::ragg
            any::patchwork
            any::scales
            any::lme4
            any::lmerTest
            any::mgcv
            any::minpack.lm
            any::broom
            any::viridis
            any::htmltools
            any::emmeans
            any::sjPlot
            any::ggeffects
            any::GGally
            any::corrplot

      - name: Render R Markdown
        run: Rscript -e 'rmarkdown::render("index.Rmd")'

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
