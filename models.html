"Good morning, colleagues and distinguished members of the Association. It is a true privilege to present here today at the 42nd Encontro Nacional da APL. Today I want to re-evaluate how early bilinguals perceive, represent, and store speech sounds in long-term memory. Specifically, we will examine the case of the Catalan mid-vowel contrast—/e/ versus /ɛ/—which has served as a central testing ground for speech learning theories for over three decades.To guide our talk today, we address three overarching questions at the intersection of bilingual phonetics and phonology :First: How are sounds represented in the minds of early bilinguals raised in an environment of sustained societal bilingualism? We re-evaluate the Catalan /e/–/ɛ/ contrast to determine whether early bilinguals possess merged, fuzzy memory targets or specified representations.Second: How does a majority societal language affect prelexical perception, phonolexical encoding, and novel word learning? Across two studies, I will examine bottom-up acoustic acuity, short-term language mode dynamics, stored phonolexical representations, and word learning using vulnerable minimal pairs.Third: Do bilinguals adapt to variability in the input, or does this variability in the input affect phonolexical encoding? We examine whether high mispronunciation acceptance in isolated tasks reflects an adaptive strategy for variable community speech, or a structural encoding deficit. These questions should bring us forth in the development of models for early bilingual speech perception and production models"

## Early bilingual Grammars


* Early bilinguals are individuals who receive regular, continuous exposure to two languages during early childhood, acquiring them either simultaneously from birth or sequentially in their preschool years &lt;small&gt;(De Houwer, 2009; Kehoe, 2021; Mayr et al., 2021; Meisel, 2009)&lt;/small&gt;.

* While the two grammars of early bilingual speakers **develop largely independently**, they also **influence each other** throughout life in both childhood and adulthood &lt;small&gt;(e.g., Genesee, 1989; Kehoe, 2021; Mayr et al., 2021; Paradis &amp; Genesee, 1996; Sundara, 2021)&lt;/small&gt;.

* This interaction often results in **crosslinguistic transfer patterns**, where speakers apply features or structures from one language when using the other &lt;small&gt;(Amengual, 2023, 2024; Bosch, 2021; James, 2012; Kehoe, 2021; Paradis &amp; Genesee, 1996)&lt;/small&gt;.

* Crucially, age of initial exposure alone does not guarantee balanced, native-like competence; instead, an early bilingual's phonetic categories and lexical representations remain dynamic across the lifespan, shaped continuously by **language dominance, cumulative daily exposure, and the quality of environmental input**. &lt;small&gt;(e.g, Amengual &amp; Simonet, 2020; Birdsong &amp; Amengual, 2021; Bosch, 2021; Mayr et al., 2021; Pallier et al., 1997; Ramón-Casas et al., 2023)&lt;/small&gt;

???



When we talk about early bilinguals, we refer to individuals who receive regular, continuous exposure to two languages from birth or early childhood. Classical work established that while their two grammars develop largely independently, they interact continuously throughout life. Crucially, early age of exposure alone does not guarantee balanced, native-like competence. Instead, phonetic categories and lexical entries remain dynamic across the lifespan, shaped continuously by language dominance, daily exposure, and input quality.
---

## Modeling Early Bilingual Sound Systems


* Cross-linguistic transfer in early bilinguals' sound system is not a static default copy of L1 structures into L2; rather, it reflects a **bidirectional and continuous interaction** between two fully co-activated sound systems &lt;small&gt;(e.g., Amengual, 2024; Birdsong &amp; Amengual, 2021; Flege &amp; Bohn, 2021; Grosjean, 2008)&lt;/small&gt;.

* Rather than consisting of two isolated compartments, an early bilingual's sound system operates as an **integrated, multi-level architecture** sharing a common cognitive space &lt;small&gt;(e.g., Flege &amp; Bohn, 2021; Natvig, 2021; Zhou &amp; Hamann, 2024)&lt;/small&gt;.

* This interaction is **dynamic across the lifespan**, fluctuating continuously according to real-time language modes, shifts in language dominance, and the quality of environmental input &lt;small&gt;(e.g., Amengual &amp; Simonet, 2020; Grosjean, 2011; Simonet &amp; Amengual, 2020)&lt;/small&gt;.

???

To understand this interaction, we must reject the notion of two isolated mental compartments. Instead, an early bilingual's sound system operates as an integrated, multi-level architecture sharing a common cognitive space. Cross-linguistic interaction is bidirectional and continuous, fluctuating dynamically according to real-time language modes, shifts in dominance, and environmental input.
---

## Modeling Early Bilingual Sound Systems


* Empirical findings show that underlying phonological contrasts are stable, whereas cross-linguistic interaction operates at the phonetic level through flexible, gradient, and adaptive representations &lt;small&gt;(e.g., Amengual, 2016, 2024; Natvig, 2021; Ramón-Casas et al., 2023; Repiso-Puigdelliura, 2025)&lt;/small&gt;

--

&lt;img src="models_files/figure-html/unnamed-chunk-2-1.svg" width="100%" /&gt;

???
Crucially, empirical findings from early bilinguals demonstrate that underlying phonological contrasts are more likely to remain **stable**, while cross-linguistic interaction operates primarily at the **phonetic level of representation**, where procedural cue-weight mapping and articulatory implementation remain **flexible, gradient, and adaptive** to language mode, daily exposure, and community input &lt;small&gt;(e.g., Amengual, 2016, 2024; Amengual &amp; Simonet, 2020; Natvig, 2021; Ramón-Casas et al., 2023; Repiso-Puigdelliura, 2025; Simonet &amp; Amengual, 2020)&lt;/small&gt;.
To formalize these loci of interaction, Natvig's integrated framework lays out three explicit processing tiers: abstract phonological knowledge at the top. this level is highly stable and resistant to attrition or loss in early bilinguals and heritage speakers, even when surface pronunciation changes significantly. the phonetic-phonology interface in the middle. Cross-linguistic contact can lead bilinguals to adopt new enhancement gestures or adjust gesture completion rules from their majority language without deleting the underlying phonological category and gradient physical implementation at the bottom. this bottom tier is highly plastic, gradient, and variable


---

## Modeling Early Bilingual Sound Systems


-   At the prelexical level, acoustic and phonotactic constraints filter continuous speech into discrete surface representations (/SF/), where L1 perceptual biases can collapse fine phonetic contrasts.
When mapped to the lexicon, these merged surface forms share a single underlying entry (|UF|) &lt;small&gt;(Boersma &amp; Hamann, 2008, 2009b; Boersma, 2011; Zhou &amp; Hamann, 2024)&lt;/small&gt; 

&lt;img src="models_files/figure-html/biphon-model-1.svg" width="90%" /&gt;



???
In Paul Boersma's Bidirectional Phonology model, cross-linguistic transfer occurs at two distinct loci. First, at the prelexical level, Cue constraints map continuous acoustic form ([AudF]) onto surface categories (/SF/). When L1 cue weights act as an attractor grid, they filter incoming acoustics into existing categories. Second, at the lexical level, surface forms map to underlying entries (|UF|) in long-term memory. When prelexical filtering collapses a contrast into a single surface form, the lexicon builder creates functional homophones—such as mapping both gall[e]da and gall[ɛ]da to a single underlying entry.
To summarize this core architectural principle: At the prelexical level, acoustic and phonotactic constraints filter continuous speech into discrete surface representations (/SF/), where L1 perceptual biases can collapse fine phonetic contrasts. When mapped to the lexicon, these merged surface forms share a single underlying entry (|UF|).


While classical models like SLM-r and PAM-L2 established how native and non-native sounds map onto shared phonetic spaces
, recent theoretical advances emphasize the necessity of separating surface phonetic variation from abstract lexical storage
. As Yazawa and Escudero (2025) demonstrate, high variability in speech tasks does not imply 'fuzzy' underlying representations
. Rather, by adopting multi-level architectures like L2LP/BiPhon and Natvig's integrated framework, we see that variability operates as a probabilistic mapping rule at the surface interface (/surface/), leaving stored lexical targets (|underlying|) fully specified
."

# .center[Theoretical Models of Bilingual Speech]
&lt;p style="text-align: center; color: #3B6978; margin-top: -15px; font-size: 0.82rem; font-style: italic;"&gt;
  Comparing Architectural Assumptions, Levels of Abstraction, and Processing Loci
&lt;/p&gt;

&lt;br&gt;

.pull-left[
  &lt;!-- Card 01: SLM-r --&gt;
  &lt;div style="background: #F8FAFC; border-left: 4px solid #0A2540; padding: 0.65em 0.9em; border-radius: 2px; box-shadow: 0 2px 5px rgba(0,0,0,0.03); margin-bottom: 0.7em;"&gt;
    &lt;h3 style="margin: 0 0 0.2em 0; color: #0A2540; font-size: 0.83rem; font-weight: 700; font-family: 'Merriweather';"&gt;
      SLM-r &lt;span style="font-weight: 400; font-size: 0.70rem; color: #3B6978;"&gt;(Flege &amp; Bohn, 2021)&lt;/span&gt;
    &lt;/h3&gt;
    &lt;p style="margin: 0; color: #1F2937; font-size: 0.72rem; line-height: 1.35;"&gt;
      &lt;strong&gt;Locus:&lt;/strong&gt; Shared L1–L2 Phonetic Common Space.&lt;br&gt;
      &lt;strong&gt;Architecture:&lt;/strong&gt; Position-sensitive allophones embedded in syllable/word contexts.&lt;br&gt;
      &lt;strong&gt;Mechanism:&lt;/strong&gt; Equivalence classification &amp; category assimilation / dissimilarity.
    &lt;/p&gt;
  &lt;/div&gt;

  &lt;!-- Card 02: PAM-L2 --&gt;
  &lt;div style="background: #F8FAFC; border-left: 4px solid #3B6978; padding: 0.65em 0.9em; border-radius: 2px; box-shadow: 0 2px 5px rgba(0,0,0,0.03);"&gt;
    &lt;h3 style="margin: 0 0 0.2em 0; color: #0A2540; font-size: 0.83rem; font-weight: 700; font-family: 'Merriweather';"&gt;
      PAM-L2 &lt;span style="font-weight: 400; font-size: 0.70rem; color: #3B6978;"&gt;(Best &amp; Tyler, 2007, 2024)&lt;/span&gt;
    &lt;/h3&gt;
    &lt;p style="margin: 0; color: #1F2937; font-size: 0.72rem; line-height: 1.35;"&gt;
      &lt;strong&gt;Locus:&lt;/strong&gt; Perceptual Assimilation across Tiers.&lt;br&gt;
      &lt;strong&gt;Architecture:&lt;/strong&gt; Explicitly separates &lt;em&gt;phonetic assimilation&lt;/em&gt; (allophones) from &lt;em&gt;phonological assimilation&lt;/em&gt; (lexical phonemes).&lt;br&gt;
      &lt;strong&gt;Mechanism:&lt;/strong&gt; Perceptual overlap, goodness-of-fit &amp; vocabulary size growth.
    &lt;/p&gt;
  &lt;/div&gt;
]

.pull-right[
  &lt;!-- Card 03: L2LP --&gt;
  &lt;div style="background: #F8FAFC; border-left: 4px solid #1E40AF; padding: 0.65em 0.9em; border-radius: 2px; box-shadow: 0 2px 5px rgba(0,0,0,0.03); margin-bottom: 0.7em;"&gt;
    &lt;h3 style="margin: 0 0 0.2em 0; color: #0A2540; font-size: 0.83rem; font-weight: 700; font-family: 'Merriweather';"&gt;
      L2LP &lt;span style="font-weight: 400; font-size: 0.70rem; color: #3B6978;"&gt;(Escudero, 2005; Escudero &amp; Yazawa, 2024)&lt;/span&gt;
    &lt;/h3&gt;
    &lt;p style="margin: 0; color: #1F2937; font-size: 0.72rem; line-height: 1.35;"&gt;
      &lt;strong&gt;Locus:&lt;/strong&gt; Developmental Scenarios &amp; Word Learning.&lt;br&gt;
      &lt;strong&gt;Architecture:&lt;/strong&gt; Initial state (Full Copying) &amp; 5 ingredients (Similar, New, Subset).&lt;br&gt;
      &lt;strong&gt;Mechanism:&lt;/strong&gt; Optimal perception via Gradual Learning Algorithm &amp; cross-situational word learning.
    &lt;/p&gt;
  &lt;/div&gt;

  &lt;!-- Card 04: BiPhon / BiPhon-HG --&gt;
  &lt;div style="background: #F8FAFC; border-left: 4px solid #374151; padding: 0.65em 0.9em; border-radius: 2px; box-shadow: 0 2px 5px rgba(0,0,0,0.03);"&gt;
    &lt;h3 style="margin: 0 0 0.2em 0; color: #0A2540; font-size: 0.83rem; font-weight: 700; font-family: 'Merriweather';"&gt;
      BiPhon-HG &lt;span style="font-weight: 400; font-size: 0.70rem; color: #3B6978;"&gt;(Boersma, 2011; Zhou &amp; Hamann, 2024)&lt;/span&gt;
    &lt;/h3&gt;
    &lt;p style="margin: 0; color: #1F2937; font-size: 0.72rem; line-height: 1.35;"&gt;
      &lt;strong&gt;Locus:&lt;/strong&gt; 4-Tier Bidirectional Generative Grammar.&lt;br&gt;
      &lt;strong&gt;Architecture:&lt;/strong&gt; &lt;code&gt;|UF|&lt;/code&gt; &amp;harr; &lt;code&gt;/SF/&lt;/code&gt; &amp;harr; &lt;code&gt;[AudF]&lt;/code&gt; &amp;harr; &lt;code&gt;[[ArtF]]&lt;/code&gt; (+ Reading Grammar).&lt;br&gt;
      &lt;strong&gt;Mechanism:&lt;/strong&gt; Noisy Harmonic Grammar (weighted Cue, Structural &amp; Orthographic constraints) explaining individual variability &amp; phonotactics.
    &lt;/p&gt;
  &lt;/div&gt;
]

&lt;br&gt;

&lt;!-- Unifying Probabilistic Framework Footer --&gt;
&lt;div style="background: #0A2540; color: #FFFFFF; padding: 0.55em 1em; border-radius: 2px; font-size: 0.72rem; text-align: center; max-width: 820px; margin: 0 auto;"&gt;
  &lt;strong&gt;Unifying Paradigm (Yazawa &amp; Escudero, 2025; Matzenauer et al., 2024):&lt;/strong&gt; 
  Probabilistic constraint-based grammars (&lt;em&gt;Stochastic OT / Noisy Harmonic Grammar&lt;/em&gt;) reconcile surface task variability at &lt;code&gt;/surface/&lt;/code&gt; with fully specified underlying lexical targets at &lt;code&gt;|underlying|&lt;/code&gt;.
&lt;/div&gt;
