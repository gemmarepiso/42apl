## Early bilingual Grammars


* Early bilinguals are individuals who receive regular, continuous exposure to two languages during early childhood, acquiring them either simultaneously from birth or sequentially in their preschool years &lt;small&gt;(De Houwer, 2009; Kehoe, 2021; Mayr et al., 2021; Meisel, 2009)&lt;/small&gt;.

* While the two grammars of early bilingual speakers **develop largely independently**, they also **influence each other** throughout life in both childhood and adulthood &lt;small&gt;(e.g., Genesee, 1989; Kehoe, 2021; Mayr et al., 2021; Paradis &amp; Genesee, 1996; Sundara, 2021)&lt;/small&gt;.

* This interaction often results in **crosslinguistic transfer patterns**, where speakers apply features or structures from one language when using the other &lt;small&gt;(Amengual, 2023, 2024; Bosch, 2021; James, 2012; Kehoe, 2021; Paradis &amp; Genesee, 1996)&lt;/small&gt;.

* Crucially, age of initial exposure alone does not guarantee balanced, native-like competence; instead, an early bilingual's phonetic categories and lexical representations remain dynamic across the lifespan, shaped continuously by **language dominance, cumulative daily exposure, and the quality of environmental input**. &lt;small&gt;(e.g, Amengual &amp; Simonet, 2020; Birdsong &amp; Amengual, 2021; Bosch, 2021; Mayr et al., 2021; Pallier et al., 1997; Ramón-Casas et al., 2023)&lt;/small&gt;

???

Good morning, colleagues and distinguished members of the Association. It is a true privilege to present here today at the 42nd Encontro Nacional da APL. Today I want to re-evaluate how early bilinguals perceive, represent, and store speech sounds in long-term memory. Specifically, we will examine the case of the Catalan mid-vowel contrast—/e/ versus /ɛ/—which has served as a central testing ground for speech learning theories for over three decades.

When we talk about early bilinguals, we refer to individuals who receive regular, continuous exposure to two languages from birth or early childhood. Classical work established that while their two grammars develop largely independently, they interact continuously throughout life. Crucially, early age of exposure alone does not guarantee balanced, native-like competence. Instead, phonetic categories and lexical entries remain dynamic across the lifespan, shaped continuously by language dominance, daily exposure, and input quality.
---

## Modeling Early Bilingual Sound Systems


* Cross-linguistic transfer in early bilinguals' sound system is not a static default copy of L1 structures into L2; rather, it reflects a **bidirectional and continuous interaction** between two fully co-activated sound systems &lt;small&gt;(e.g., Amengual, 2024; Birdsong &amp; Amengual, 2021; Flege &amp; Bohn, 2021; Grosjean, 2008)&lt;/small&gt;.

* Rather than consisting of two isolated compartments, an early bilingual's sound system operates as an **integrated, multi-level architecture** sharing a common cognitive space &lt;small&gt;(e.g., Flege &amp; Bohn, 2021; Natvig, 2021; Zhou &amp; Hamann, 2024)&lt;/small&gt;.

* This interaction is **dynamic across the lifespan**, fluctuating continuously according to real-time language modes, shifts in language dominance, and the quality of environmental input &lt;small&gt;(e.g., Amengual &amp; Simonet, 2020; Grosjean, 2011; Simonet &amp; Amengual, 2020)&lt;/small&gt;.

???

To understand this interaction, we must reject the notion of two isolated mental compartments. Instead, an early bilingual's sound system operates as an integrated, multi-level architecture sharing a common cognitive space. Cross-linguistic interaction is bidirectional and continuous, fluctuating dynamically according to real-time language modes, shifts in dominance, and environmental input.
---

## Modeling Early Bilingual Sound Systems


* Crucially, empirical findings from early bilinguals demonstrate that underlying phonological contrasts are more likely to remain **stable**, while cross-linguistic interaction operates primarily at the **phonetic level of representation**, where procedural cue-weight mapping and articulatory implementation remain **flexible, gradient, and adaptive** to language mode, daily exposure, and community input &lt;small&gt;(e.g., Amengual, 2016, 2024; Amengual &amp; Simonet, 2020; Natvig, 2021; Ramón-Casas et al., 2023; Repiso-Puigdelliura, 2025; Simonet &amp; Amengual, 2020)&lt;/small&gt;.

* The **Catalan stressed vowel system** includes seven vowels: /i e ɛ a ɔ o u/, contrasting:
  * High-mid: /e, o/
  * Low-mid: /ɛ, ɔ/
* The **lexical distribution** of these mid vowels varies across dialects.




???
Where could transfer occur in the phonetic systems? (Natvig, 2019)


- It could occur at the phonetic-perceptual level of representation (perception)

- It could occur when mapping phonetic categories to gestures (production)

- It could occur at the level of the lexical representation (mapping of phonemes at the level of the phonological word)



- It could occur at the perceptual level: cue-weightings that are influenced by the Spanish grammar, and associate a low-mid vowel to a high mid vowel, Spanish cue-weightings are active when examining Catalan cue-weightings





## Loci of Cross-Linguistic Transfer in BiPhon

.pull-left[
### **1. Prelexical Perception ([AudF] \\(\rightarrow\\) /SF/)**
* **Cue Constraints (`[Acoustics] /Category/`):** 
  * Map continuous auditory dimensions (\\(F1, F2, F3\\), duration) onto discrete surface categories.
  * *L1 Filtering:* L1 cue weights act as an attractor grid (e.g., mapping Catalan \\(/e/\text{--}/\varepsilon/\\) or foreign liquids to L1 target regions).

* **Structural Constraints (`Phonotactics`):**
  * Enforce language-specific syllable well-formedness (e.g., coda restrictions).
  * Conflict between Cue and Structural constraints triggers **perceptual repairs** (e.g., illusory schwa epenthesis in prohibited codas).
]

.pull-right[
### **2. Lexical Encoding (/SF/ \\(\leftrightarrow\\) |UF|)**
* **Faithfulness Constraints (`|UF| /SF/`):**
  * Map surface representations (/SF/) to stored lexical items (|UF|) in long-term memory.

* **Functional Homophony &amp; "Fuzzy" Entries:**
  * When prelexical Cue constraints collapse a non-native contrast into a single /SF/ category (single-category assimilation), the lexical mapping produces **functional homophones**.
  * *Example:* Spanish-dominant bilinguals map both *gall[e]da* and *gall[ɛ]da* to the same underlying entry `|galleda|`.
]

???

Natvig's integrated framework lays out three explicit tiers: abstract phonological knowledge at the top, the phonetic-phonology interface in the middle, and gradient physical implementation at the bottom. Empirical evidence demonstrates that underlying phonological contrasts remain remarkably stable in early bilinguals. Cross-linguistic interaction operates primarily at the phonetic interface, where procedural cue-weight mapping remains flexible, gradient, and adaptive.

---

## Modeling Ealry Bilingual Sound Systems


-   At the prelexical level, acoustic and phonotactic constraints filter continuous speech into discrete surface representations (/SF/), where L1 perceptual biases can collapse fine phonetic contrasts.
When mapped to the lexicon, these merged surface forms share a single underlying entry (|UF|) &lt;small&gt;(Boersma &amp; Hamann, 2008, 2009b; Boersma, 2011; Zhou &amp; Hamann, 2024)&lt;/small&gt; 

&lt;img src="presentation_18092026_files/figure-html/biphon-model-1.svg" alt="" width="90%" /&gt;



???
In Paul Boersma's Bidirectional Phonology model, cross-linguistic transfer occurs at two distinct loci. First, at the prelexical level, Cue constraints map continuous acoustic form ([AudF]) onto surface categories (/SF/). When L1 cue weights act as an attractor grid, they filter incoming acoustics into existing categories. Second, at the lexical level, surface forms map to underlying entries (|UF|) in long-term memory. When prelexical filtering collapses a contrast into a single surface form, the lexicon builder creates functional homophones—such as mapping both gall[e]da and gall[ɛ]da to a single underlying entry.
To summarize this core architectural principle: At the prelexical level, acoustic and phonotactic constraints filter continuous speech into discrete surface representations (/SF/), where L1 perceptual biases can collapse fine phonetic contrasts. When mapped to the lexicon, these merged surface forms share a single underlying entry (|UF|).

---
## Modeling Early Bilingual Sound Systems

- Early-established L1 cue weights act as a perceptual filter, collapsing distinct acoustic inputs into a single phonetic category space &lt;small&gt;(Flege, 1995; Flege &amp; Bohn, 2021)&lt;/small&gt;. 

&lt;img src="presentation_18092026_files/figure-html/slm-1.svg" alt="" width="100%" /&gt;

???
A parallel perspective comes from James Flege's Revised Speech Learning Model. SLM-r posits that L1 and L2 sounds reside in a single shared phonetic space. When an L2 sound is perceived as phonetically similar to an L1 category, equivalence classification occurs, absorbing the sound into an existing category space and preventing the formation of a distinct new category.
This parametric vowel space illustrates the three outcomes predicted by SLM-r: full single-category assimilation into a composite diaphone, equivalence class emergence where dissimilarity is discerned, and eventual new category formation accompanied by phonetic deflection in the shared space.

---
## Shortcomings of these models

-   Models &lt;small&gt;(SLM-r, PAM-L2, L2LP)&lt;/small&gt; explain how new L2 categories emerge from L1 categories or cue weightings, but offer few mechanisms for real-time category co-existence in **simultaneous bilinguals**.

-  They treat perception as a fixed trait (AoA, exposure ratio), lacking mechanisms for how online **language mode** &lt;small&gt;(Grosjean, 2008)&lt;/small&gt; or working-memory **co-activation** &lt;small&gt;(Green &amp; Abutalebi, 2013)&lt;/small&gt; dynamically modulate perception.

-  They presume stable, homogeneous input, ignoring how **community-level input variability** (e.g., regional/accented speech) continuously reshapes sound categorization.

-  They assume prelexical perception directly dictates storage, failing to explain why listeners exhibit **acoustic acuity (XAB)** alongside poor lexical task performance &lt;small&gt;(Amengual, 2016; Darcy et al., 2013; Llompart, 2021)&lt;/small&gt;.

???
Despite their foundational contributions, classical speech models exhibit four major theoretical limitations. First, they prioritize sequential L2 acquisition, offering few mechanisms for real-time category co-existence in simultaneous bilinguals. Second, they presume stable, homogeneous input, ignoring community-level input variability. Third, they assume perception directly dictates storage, failing to explain why listeners can show intact prelexical acoustic acuity alongside poor lexical performance. Finally, they treat perception as a static trait, lacking explicit mechanisms for how online language mode or working-memory co-activation dynamically modulates boundary steepness

## Sociolinguistic context in Catalonia (I)

&lt;img src="map.png" alt="" width="50%" style="display: block; margin: auto;" /&gt;

To understand speech representations in Catalonia, we must consider its unique sociolinguistic context. Catalan and Spanish are co-official languages. Since the 1980s, an educational immersion model ensures all children receive schooling in Catalan regardless of home language, creating a highly bilingual society with varying daily usage patterns.

Demographic data from the Enquesta d'Usos Lingüístics shows that habitual language use in Catalonia is highly dynamic. Over the past two decades, while Spanish remains the primary language for ~46.5% of the population, Catalan habitual use stands at ~32.6%, with a growing proportion identifying as habitually bilingual or using other languages. This creates a complex, variable acoustic input environment.

## The Catalan Vowel System


&lt;img src="presentation_18092026_files/figure-html/vowel-space-scheme-1.svg" alt="" width="100%" /&gt;
???


Phonetically, Catalan possesses a 7-vowel system contrasting close-mid /e/ and open-mid /ɛ/. Spanish possesses a 5-vowel system with a single mid-front vowel category /e/. For Spanish-dominant bilinguals, acquiring and maintaining the Catalan /e/–/ɛ/ contrast requires establishing a new perceptual boundary within a region where Spanish has only one category.---

**Catalan-Dominant** (n = 20): Raised by Catalan-speaking parents; exposed to Catalan from birth.

**Spanish-Dominant** (n = 20): Raised by Spanish-speaking parents; early intensive Catalan immersion started between ages 1–6 (mean age = 4.35 years).

In their landmark 1997 study, Pallier and colleagues evaluated early Catalan-dominant and Spanish-dominant bilinguals who had been immersed in Catalan since preschool. In identification tasks, Spanish-dominant bilinguals showed a flattened categorization curve. In AX discrimination, while Catalan-dominant bilinguals showed a clear peak at the boundary, Spanish-dominant bilinguals performed near chance, suggesting a limit on behavioral plasticity.

## Early exposure as a crucial factor for the mid vowel contrast

#### **Ramon-Casas et al. (2023)**


* **Sample Size:** `\(N = 36\)` early bilingual preschoolers (M age = 4.5 years; range: 4;0–5;0).
* **Location:** 4 public immersion kindergartens in the Barcelona metropolitan area.
* **Catalan Exposure:** Intensive, continuous exposure (at least 5 days/week since age 3).



&lt;img src="presentation_18092026_files/figure-html/ramon-casas-dissociation-plot-1.svg" alt="" width="70%" /&gt;





]

???

Evaluating 4.5-year-old preschoolers in immersion kindergartens, Ramón-Casas et al. found that Catalan-dominant children significantly outperformed Spanish-dominant peers on familiar target words (84.4% vs 60.8%). Crucially, both groups performed near chance on non-words, showing that early contrast processing relies on stored whole-word entries rather than abstract rules. Furthermore, unaccented L1 home input from Catalan-speaking grandparents significantly reduced mispronunciation acceptance.

---

### Is contrast sensitivity reduced or enhanced depending on language mode?



* Spanish-dominant early bilinguals show reduced sensitivity to the /e/–/ɛ/ contrast in static XAB discrimination, whereas Catalan-dominant bilinguals exhibit robust category boundaries &lt;small&gt;(Pallier et al., 1997; Ramón-Casas et al., 2023)&lt;/small&gt;.


* Is prelexical sensitivity fixed, or does operating in a **Spanish language mode** temporarily attenuate boundary sharpness (`\(s\)`) versus maintaining cooperative co-activation without boundary flattening?

* Second, how does acoustic acuity map onto stored word representations (|UF|) and functional mispronunciation tolerance across development?

???

Up to this point, the literature provides a static snapshot based on single-session prelexical tasks. This leaves two fundamental questions open: First, is prelexical contrast sensitivity fixed, or does operating in a Spanish language mode temporarily attenuate boundary sharpness versus maintaining cooperative co-activation? Second, how does acoustic acuity map onto stored word representations (|UF|) and functional mispronunciation tolerance across development?

# Language mode and dominance-related effects in the perception of the mid vowel Catalan contrast



Joint work with Chao Zhou **Universidade Lisboa**

???

This brings us to Study 1, conducted in collaboration with Chao Zhou at the Universidade de Lisboa, where we directly test the role of real-time language mode and language dominance.
---
## Is Contrast Sensitivity Modulated by Language Mode?


 * Perceptual categories in early bilinguals are not static; they shift dynamically based on real-time activation levels across communicative contexts &lt;small&gt;(Grosjean, 1998, 2008, 2020; Green &amp; Abutalebi, 2013)&lt;/small&gt;.

* When a contrast exists in **both** languages (e.g., VOT in /p/-/d/), bilinguals shift category boundaries between monolingual sessions to match target-language phonetic norms &lt;small&gt;(Elman et al., 1977; Flege &amp; Eefting, 1987; Garcia-Sierra et al., 2009; Gonzales &amp; Lotto, 2013)&lt;/small&gt;.

* Language mode dynamically reweights acoustic cues (e.g., spectral vs. temporal cues) and induces phonetic convergence under dual-language co-activation or cognate exposure &lt;small&gt;(Amengual et al., 2019; Simonet, 2014; Simonet &amp; Amengual, 2020; Yazawa et al., 2020)&lt;/small&gt;.


  * Prior studies evaluated contrasts present in **both** systems (where overlapping categories trigger competitive top-down inhibition).
  
&gt;  * **Question:** Does language mode reduce or enhance sensitivity when a contrast is **only** present in Catalan (/e/-/ɛ/) but absent in Spanish (/e/)? 

???
*"Before jumping into our experimental findings, let’s unpack why language mode is so crucial here.
We know from extensive literature—from Grosjean’s language mode framework to Green and Abutalebi’s Adaptive Control Hypothesis—that perceptual categories in early bilinguals are not static traits. Instead, they shift dynamically based on real-time language activation levels across different communicative contexts.
When a sound contrast exists in both of a bilingual’s languages—such as Voice Onset Time in English versus Spanish /p/ and /b/—bilinguals dynamically shift their category boundaries between monolingual sessions to match the active target language. In these shared contrasts, language mode continuously reweights acoustic cues and induces phonetic convergence under dual-language co-activation.
However, there is a key theoretical gap: all of those prior studies evaluated contrasts present in both language systems, where overlapping categories trigger competitive top-down inhibition.
This brings us to our core question: What happens when a contrast is UNILATERAL? That is, does operating in a Spanish language mode reduce or enhance sensitivity when the mid-vowel contrast exists only in Catalan (/e/–/ɛ/), but is completely absent in Spanish?"*
---

## Research Questions

&gt; **RQ1**  
&gt; Do bilinguals show a less robust `\(/e-ɛ/\)` contrast (language-specific) than an `\(/i-e/\)` contrast (shared cross-linguistically)?

Hypothesis: Perceptual sensitivity will be lower for `\(/e-ɛ/\)` (present in Catalan, absent in Spanish), whereas `\(/i-e/\)` (present in both systems) will exhibit ceiling-level sensitivity.

&gt; **RQ2**  
&gt; Does language mode dynamically modulate perceptual sensitivity to `\(/e-ɛ/\)`?

Hypothesis: Perceiving in a Spanish mode will attenuate contrast sensitivity, while a Catalan mode will enhance prelexical perception.

???

We addressed two key research questions. RQ1: Do bilinguals show less robust sensitivity for the unilateral /e/–/ɛ/ contrast compared to the shared /i/–/e/ contrast? We hypothesized lower sensitivity for /e/–/ɛ/. RQ2: Does language mode dynamically modulate perceptual sensitivity? We tested whether perceiving in a Spanish mode attenuates contrast sensitivity compared to a Catalan mode.
---

## Methodology: Design

.pull-left[
* **Discrimination task:**
  * 4 blocks of 24 AXB trials (96 trials per language mode session).
  * Tested across 2 sessions spaced at least 7 days apart.

* **Picture-Naming task:**
  * Prior to each 24-trial block, participants name 10 non-cognate pictures (to maintains activation of the target language mode throughout testing).
]

.pull-right[

* **Continuous Predictors:**
  1. **Dominance Index (BLP):** Ranging from strongly Catalan-dominant (&lt;0) to Spanish-dominant (&gt;0).
  2. **Formant Acuity Task:** Bottom-up sensory threshold along continuous F1/F2 space &lt;small&gt;(Saito et al., 2022)&lt;/small&gt;.
]

???

Our design tested early bilinguals across two distinct sessions spaced at least 7 days apart—one entirely in Catalan mode, the other in Spanish mode. To maintain language mode activation, participants completed a non-cognate picture-naming task before each block. We measured continuous language dominance via the Bilingual Language Profile and baseline formant acuity using a psychoacoustic threshold task.

# Results: 4PL Nonlinear Modeling


Perceptual categorization curves were evaluated by fitting a 4PL logistic function:

`$$f(x) = a_1 + \frac{a_2 - a_1}{1 + e^{-s(x - c)}}$$`

- `\(a_1, a_2\)`: Lower and upper asymptotes (constrained within `\([0, 1]\)`).
- `\(c\)`: Crossover point (category boundary location).
- `\(s\)`: Boundary steepness/slope parameter (higher values = sharper perception).

&lt;img src="presentation_18092026_files/figure-html/unnamed-chunk-8-1.svg" alt="" width="80%" /&gt;

???
To analyze category perception with mathematical rigor, we fitted 4-parameter logistic (4PL) nonlinear models to each participant's individual response curves across the continuum. Unlike standard 2-parameter models, 4PL fits four distinct parameters: lower and upper asymptotes (`\(a_1\)` and `\(a_2\)`) to account for floor and ceiling performance, crossover point (`\(c\)`) to measure exact category boundary location along the acoustic spectrum, and slope (`\(s\)`) to index boundary steepness or sharpness. By estimating floor and ceiling independently for each listener, 4PL prevents baseline noise from distorting the slope, allowing us to mathematically isolate boundary location (`\(c\)`) from perceptual acuity (`\(s\)`).

# Results: Boundary Sharpness

Category boundary sharpness was significantly shallower for the target /e/–/ɛ/ contrast compared to the baseline /i/–/e/ contrast (b = -3.80, p &lt; .001).

&lt;img src="presentation_18092026_files/figure-html/unnamed-chunk-9-1.svg" alt="" width="80%" /&gt;
???
What you see in this graph is an individual-level breakdown of slope differences  calculated by subtracting the slope of /i/–/e/ from /e/–/E/. The central dashed line represents zero—meaning identical boundary steepness for both contrasts. Notice how the plot is overwhelmingly dominated by orange bars extending to the left. This shows that virtually every single bilingual in our sample maintains a much sharper, categorical transition for the shared /i/–/e/ baseline than for the mid vowel contrast.Crucially, when we examine these individual slopes across language modes, operating in a Spanish context does not flatten or attenuate this boundary steepness.

# Generalized Additive Mixed Models

Generalized Additive Mixed Models (GAMM) on raw trial-by-trial accuracy. Captures non-linear trajectories across continuum steps while controlling for item and participant variability.
&lt;img src="presentation_18092026_files/figure-html/unnamed-chunk-10-1.svg" alt="" width="100%" /&gt;
???
To capture trial-by-trial non-linear dynamics, we fitted Generalized Additive Mixed Models. GAMMs revealed a significant interaction between formant acuity and continuum position specifically in Catalan mode (p = .009), where high-acuity listeners showed enhanced accuracy in the ambiguous /e/ region.

## Discussion (1)

* **Weakly encoded contrast:** Greatest boundary steepness (*s*) for /i/–/e/ than /e/–/ɛ/ → Mid-vowels are encoded less robustly encoded. A universally weak contrast? Mid-vowel distinctions rely on late-emerging tongue height features ([RTR]), representing the final vocalic contrasts specified in development (Fikkert, 2005).

* **Stability across language modes:** Boundary location (*x*₀) and steepness (*s*) remain invariant across Catalan and Spanish contexts → **Spanish mode does not suppress non-target categories**.

* **Individual differences:** Formant acuity interacts with continuum position specifically in Catalan mode (*p* = .009) → Activating a denser mid-vowel space demands higher acoustic acuity.

* **Adaptive perceptual gradiency:** Catalan dominance exerts a linear main effect across the continuum → Reflects **heightened within-category sensitivity** rather than a shifted boundary, enabling flexible mapping of variable community input.

???

*"To summarize our findings for Study 1: First, boundary steepness confirms that the /e/–/ɛ/ contrast is less robustly encoded than /i/–/e/.
Second, boundary position and steepness remain remarkably stable across Catalan and Spanish language modes, proving that operating in a Spanish context does not attenuate non-target category perception.
Third, we found a significant interaction between formant acuity and Catalan mode (p = .009), suggesting that activating Catalan engages a denser mid-vowel space where fine acoustic acuity becomes crucial.
Finally, higher Catalan dominance showed a linear main effect across the entire continuum—reflecting heightened within-category sensitivity rather than a boundary shift, serving as an adaptive mechanism to process variable community speech."*

### Phonolexical Encoding in Early Bilinguals

* L1 phonological transfer extends beyond acoustic perception into **phonolexical encoding**. Non-native contrasts which may be mapped onto a single L1 category (single-category assimilation) produce "fuzzy" or imprecise lexical representations in long-term memory.

* Under BiPhon&gt; During lexical acquisition, the lexicon builder takes /SF/ as its input to create |UF| entries. If the perceptual grammar continuously outputs /e/ for both vowels, the lexicon builder receives no evidence to establish two separate underlying lexical forms.


* However, empirical work shows that perception and lexical encoding can decouple, accurate prelexical discrimination does not guarantee distinct lexical encoding  &lt;small&gt;(Darcy et al., 2012, 2013; Darcy &amp; Rothgerber, 2020)&lt;/small&gt;.


???

Moving beyond prelexical mode dynamics, we must address how prelexical perception connects to lexical storage. In BiPhon, during lexical acquisition, the lexicon builder takes surface forms (/SF/) as input to build underlying entries (|UF|). If prelexical filtering continuously outputs /e/, no separate underlying forms should be established. However, empirical work shows that perception and lexical encoding can decouple.

## Multitask battery

| Level | Experimental Paradigm | Core Question |
| :--- | :--- | :--- |
| **1. Acoustic-perceptual ** | XAB Discrimination | Evaluates bottom-up, prelexical acoustic-phonetic discrimination |
| **2.1 Lexical encoding** | Lexical Decision | Examines whether acoustic-phonetic differences are functionally encoded into real-word representations stored in long-term memory |
| **2.2 Lexical encoding** | Lexical Preference |Disentangles underlying phonolexical representations from functional tolerance for accented speech.|
| **3. Learning** | Novel Word Learning | Assesses whether acoustic detail is retained for lexical storage under higher referential and cognitive load. |


Our multi-task battery decouples processing tiers across 4 tasks: XAB measures bottom-up prelexical discrimination; Lexical Decision tests online mispronunciation acceptance; Lexical Preference forces a 2-alternative choice to directly measure stored target fidelity (|UF|); and Novel Word Learning tests whether contrast detail is retained during new lexical encoding under cognitive load.

???

""To understand how L2 learners process phonological contrasts, we cannot rely on a single task. This decision tree maps out how four distinct tasks systematically isolate five unique learner profiles, moving from raw acoustic perception all the way to novel word learning."[Task 1 &amp; Profile A]"We begin at the top with Task 1: XAB Discrimination. The fundamental question here is: Can the listener acoustically distinguish the vowel contrast?If the answer is NO, the learner falls into Profile A: Merged Vowel Categories. At this stage, the L1 perceptual filter collapses the contrast—for instance, treating `\(/e/\)` and `\(/ɛ/\)` as phonetically identical—meaning no distinct underlying representation (`\(\vert{}UF\vert{}\)`) can even be established in memory."[Task 2 &amp; Profile B]"If the answer is YES, we move down to Task 3: Lexical Preference (2AFC). Here we ask: Do they prefer canonical forms for familiar words?If they fail here, we get Profile B: Fuzzy Lexical Encoding. These learners possess the low-level acoustic ability to tell the sounds apart in isolation, but their long-term lexical representations remain underspecified or 'fuzzy' in memory."[Task 3 &amp; Profile C]"If they pass Lexical Preference, we proceed to Task 2: Lexical Decision Task to test online word recognition: Do they actively reject mispronunciations?A negative result points to Profile C: Flexible Word Recognition. These speakers have both intact acoustic perception and distinct stored representations, but during real-time processing, they exhibit high online tolerance—often an adaptive strategy to handle variability in community speech."[Task 4 &amp; Profiles D &amp; E]"Finally, if they reject mispronunciations, we test productive learning capability in Task 4: Novel Word Learning: Can they leverage this contrast to encode new words?If NO, they fall into Profile D: Uncoupled Lexical Encoding. They have mastered established vocabulary, but fail to efficiently recruit the contrast when expanding their lexicon.If YES, they reach Profile E: Fully Integrated Contrast—showing complete integration across perception, storage, real-time recognition, and new word acquisition.""*

### Task 1: XAB Discrimination Performance

GLMM Model: Significant negative effect for experimental /e/–/ɛ/ trials (beta = -2.055, z = -7.398, p &lt; 0.001).

&lt;img src="presentation_18092026_files/figure-html/xab_combined-1.svg" alt="" width="100%" style="display: block; margin: auto;" /&gt;

???

In Task 1 (XAB Discrimination), GLMM modeling confirmed robust prelexical discrimination for both children and adults, though experimental mid-vowel pairs were significantly lower than control fillers (p &lt; .001). 
---

### Task 2: Lexical Decision Accuracy

GLMM Model: Difficult condition leads to a sig. decrease in accuracy (beta = -3.768, z = -9.431, p &lt; 0.001). /ɛ/ is particularly vulnerable to misidentification in difficult contexts (beta = -1.377, z = -2.455, p = 0.0141).

&lt;img src="presentation_18092026_files/figure-html/ld_combined-1.svg" alt="" width="100%" style="display: block; margin: auto;" /&gt;


???
Examining the Lexical Decision results across the three conditions, three key findings emerge. First, looking at the graph, participants perform near ceiling (&gt;90–95% accuracy) on Canonical real words and Easy control mispronunciations (where vowels are replaced by distant vowels like /a/ or /i/). Crucially, this ceiling performance on control trials proves that children were fully capable of executing the task—they understood the rules, maintained attention, and successfully made lexical decisions, validating the paradigm developmentally.Second, in the Difficult condition where mid-vowels are swapped (/e/ `\(\leftrightarrow\)` /ɛ/), accuracy drops dramatically (`\(b = -3.768, p &lt; .001\)`), with participants accepting non-canonical forms up to 60–85% of the time. Third, there is a striking directional asymmetry: mispronunciations of canonical /e/ words (replacing /e/ with [ɛ]) were rejected around 35–40% of the time, whereas mispronunciations of canonical /ɛ/ words (replacing /ɛ/ with [e], e.g., gall[e]da for gall[ɛ]da) were rejected only ~15% of the time.Theoretically, this asymmetry reflects the input statistics of Barcelona bilingual speech, where Spanish speakers routinely produce [e] for /ɛ/, but rarely the reverse. Listeners develop a flexible processing strategy accepting [e] variants to parse accented community input.

---
### Task 3: Lexical Preference Performance

GLMM Model:  /ɛ/ sig. lower performance compared to close /e/ (beta = -0.679, z = -4.541, p &lt; 0.001). 


&lt;img src="presentation_18092026_files/figure-html/lp_combined-1.svg" alt="" width="100%" style="display: block; margin: auto;" /&gt;


???

Looking closely at the target vowels, we also observe a subtle but systematic vowel difference in Lexical Preference:
• Target /e/ Words (e.g., ocell [useʎ] vs. *[usɛʎ]): Listeners show an exceptionally high preference for canonical /e/ (~85–90%+). Because close-mid /e/ is a shared category present in both Spanish and Catalan, substituting lower-mid [ɛ] into an /e/ target creates an acoustic violation that sounds distinctly unnatural, making the canonical choice unmistakable.
• Target /ɛ/ Words (e.g., barreja [bə'rɛʒə] vs. *[bə'reʒə]): Preference for canonical /ɛ/ remains high (~75–80%+, well above the 50% chance baseline). However, because the [e] mispronunciation matches the omnipresent Spanish-accented community variant in Catalonia, the [e] form carries a slight familiarity effect, resulting in a slightly less steep preference 

---

## Conclusions


-   Mid vowel contrast (/e/–/ɛ/) remain stable across Catalan and Spanish modes (*x*₀ and *s* invariant). Co-activating Spanish introduces zero category overlap, enabling **cooperative co-activation** without top-down boundary suppression.

-  High acceptance of mispronunciations in Lexical Decision reflects an **adaptive processing strategy** for variable community speech—**NOT "fuzzy" underlying word forms (|UF|)**, as proven by robust target selection (&gt;80%) in forced-choice Lexical Preference.

- Stored target fidelity directly drives novel word encoding in adults (*r* = .816), but remains uncoupled in children (*r* = .075)—revealing that **representation-to-learning integration is an emergent developmental milestone**.
