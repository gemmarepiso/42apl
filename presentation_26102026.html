Good morning, colleagues and members of the Association—of the Associação Portuguesa de Linguística. It is a true privilege to present here today at the Universidade do Algarve.

And today, what I want to do is to re-evaluate how early bilinguals perceive, represent, and store speech sounds in long-term memory. Specifically, we will examine the case of the Catalan mid-vowel contrast /e/ versus /ɛ/—we will be talking a lot about it—which has served as a central testing ground for the speech system of early Catalan-Spanish bilinguals.

Our goal today is to bridge classical perceptual frameworks with modern multi-tier architectural models, demonstrating that early bilingual speech representations are neither static nor structurally deficient. We will be asking the questions, more specifically:

How are sounds represented in the minds of early bilinguals raised in an environment of sustained societal bilingualism?

How does the majority societal language affect pre-lexical perception, phono-lexical encoding, and novel word learning?

Do bilinguals adapt to variability in the input? (This is going to be a recurring theme."
---

## Early bilingual Grammars


* Early bilinguals are individuals who receive regular, continuous exposure to two languages during early childhood, acquiring them either simultaneously from birth or sequentially in their preschool years &lt;small&gt;(De Houwer, 2009; Kehoe, 2021; Mayr et al., 2021; Meisel, 2009)&lt;/small&gt;.

* While the two grammars of early bilingual speakers **develop largely independently**, they also **influence each other** throughout life in both childhood and adulthood &lt;small&gt;(e.g., Genesee, 1989; Kehoe, 2021; Mayr et al., 2021; Paradis &amp; Genesee, 1996; Sundara, 2021)&lt;/small&gt;.

* This interaction often results in **crosslinguistic transfer patterns**, where speakers apply features or structures from one language when using the other &lt;small&gt;(e.g., Amengual, 2023, 2024; Bosch, 2021; Kehoe, 2021; Paradis &amp; Genesee, 1996)&lt;/small&gt;.


???

When we talk about early bilinguals, we refer to individuals who receive regular, continuous exposure to two languages from birth or early childhood. Classic research established that while their two grammars develop autonomously, they interact continuously throughout life. Crucially, early age of exposure alone does not guarantee balanced or static native-like competence. Instead, phonetic categories and lexical entries remain dynamic across the lifespan, and they are continuously shaped by shifts in language dominance, daily exposure, and community input.

---

## Modeling Early Bilingual Sound Systems


* An early bilingual’s sound system operates within a shared phonetic space, where cross-linguistic interaction is bidirectional, continuous, and dynamic across the lifespan—fluctuating continuously according to shifts in language dominance, additional language acquisition, and environmental input &lt;small&gt;(e.g., Amengual, 2024; Amengual &amp; Simonet, 2020; Birdsong &amp; Amengual, 2021; Flege &amp; Bohn, 2021; Grosjean, 2008; Kupisch et al., 2021; Natvig, 2021; Repiso-Puigdelliura, 2025; Simonet &amp; Amengual, 2020)&lt;/small&gt;.

To understand this cross-linguistic interaction, we must probably reject the notion of two isolated mental compartments. Instead, an early bilingual sound system probably operates as an integrated, multi-level architecture sharing a single—as an integrated, multi-level architecture. Early speech models, such as the Speech Learning Model, for example, proposed that bilinguals have a single phonetic space.

Now, cross-linguistic interaction is bidirectional and continuous, and it dynamically fluctuates with real-time shifts in dominance in the environmental input. Crucially, this holds true even for sequential bilinguals. Let me here just digress for one second: to provide empirical evidence for this lifespan phonetic permeability, my 2025 study in Glossa evaluates regressive cross-linguistic influence from an L3 (in this case, English) into an L1 Catalan and Spanish (in this case, our early Catalan-Spanish bilinguals). Now, in canonical L1 Catalan and Spanish, vowel-to-vowel sequences across words, such as in perú íntim [parú íntim], the two vowels—the word-final vowel and the vowel-initial at the word boundary of the second word—are produced with a modal transition, so with continuous speech. But in English, there is an option of inserting a glottal stop, so this would sound something like perú [ʔ]íntim.So, what I found is that specifically for speakers who had had experience living abroad in English-speaking countries, they showed transfer from an L3 or a foreign language (L$n$, in this case) into their L1 Catalan and Spanish. This graph shows percentage of glottalization on the y-axis, and then use of glottal marking in their English, and that also correlated with exposure to English. Ultimately, this confirms that even early-acquired native sound systems remain permeable across the lifespan

## Modeling Early Bilingual Sound Systems


* Crucially, empirical findings from early bilinguals demonstrate that underlying phonological contrasts are more likely to remain **stable**, while cross-linguistic interaction operates primarily at the **phonetic level of representation**&lt;small&gt;(e.g., Amengual, 2016, 2024; Amengual &amp; Simonet, 2020; Natvig, 2021; Ramón-Casas et al., 2023; Repiso-Puigdelliura, 2025; Simonet &amp; Amengual, 2020)&lt;/small&gt;.



*Tap-trill distinction in Spanish heritage speakers* (Repiso-Puigdelliura &amp; Perry, 2026)

&lt;img src="Figure2.png" width="100%" style="display: block; margin: auto;" /&gt;



???

Now, the question that we can ask is: what is vulnerable to being transferred? Findings from early bilinguals demonstrate that underlying phonological contrasts seem to be more stable than the phonetic level of representation.

And to see how this operates in speech production, let's examine findings from my recent study with Scott Perry on the Spanish tap-trill contrast in intervocalic positions—so /ɾ/ and /r/, such as pero and perro. The tap is produced with one occlusion, while the trill is produced with two or more occlusions (/r/). In intervocalic rhotic positions, when primary canonical gestures (such as the number of tongue-tip occlusions) show surface variability under bilingual contact, adult heritage Spanish speakers do not collapse the two phonemes. Instead, they use secondary cues to show this contrast. So, they adaptively re-weight their mapping of cues, recruiting duration as a secondary acoustic cue to preserve a non-overlapping contrast between taps and trills.

We can see here in Figure A how child and adult bilinguals on the right show a reduction in the durational implementation of the contrast, but they nevertheless show a non-overlapping contrast between the /ɾ/ and the /r/.

## Modeling Early Bilingual Sound Systems



&lt;img src="presentation_26102026_files/figure-html/unnamed-chunk-3-1.svg" width="90%" /&gt;




???

To formalize how bilinguals map continuous speech onto lexical meanings in their two grammars, several models have been proposed, but we will today draw upon the Second Language Linguistic Perception Model (L2LP), which has co-evolved with the Bidirectional Phonetics and Phonology framework, or the Bi-Phon model.

Under these models, processing unfolds across four distinct hierarchical tiers:

Physical Entry Point: The continuous acoustic signal enters as an auditory form. This is where listeners receive formant structure, duration, and all other relevant acoustic signals.

Pre-lexical Cue Integration Grammar: This maps acoustic formants onto discrete surface forms. These surface forms encode language-specific phonetic categories, as well as allophonic detail.

Phonological Grammar: This matches these surface categories to canonical underlying forms that are already stored in the lexicon.

Lexical Constraints: These link underlying target representations to their semantic lexical forms.

Under the L2LP model, which draws on full access, when a second language learner learns a second language, they copy their L1 grammar. So, second language acquisition begins with a complete duplicate of the listener's L1 optimal perception grammar. Cue constraints are copied in full to form the L2 initial state. This transfer operates across two distinct mappings:

First, at the pre-lexical level, where L1 cue constraints filter the L2 acoustic input.

Second, at the lexical level, where merged surface categories fail to trigger lexical targets.

For example, take native Spanish speakers learning the Portuguese mid-vowel contrast in avô /a'vo/ versus avó /a'vɔ/. At the pre-lexical level, because the copied Spanish perception grammar lacks an open-mid vowel category /ɔ/ and contains only one back mid-vowel /o/, Spanish cue constraints map both Portuguese acoustic tokens of avô and avó onto the single surface category /o/. And at the lexical level, because surface perception outputs only /o/ for both items, the lexicon builder receives no phonological evidence to construct two separate targets, mapping both words onto a single underlying representation /a'vo/ and creating spurious homophony in memory.


---
## Modeling Early Bilingual Sound Systems

&lt;img src="presentation_26102026_files/figure-html/unnamed-chunk-4-1.svg" width="100%" /&gt;


???
Now, what happens with early bilinguals, however?  The L2LP speech model also accounts for simultaneous bilingual acquisition, but here, rather than forcing both languages into a copy of one or the other, the model posits that two systems can develop, establishing distinct bidirectional architectures that run in parallel.

Depending on the communicative context, executive control mechanisms modulate the systems through activation and inhibition. For example, when a bilingual is in monolingual mode, Grammar A is fully activated, enabling rapid feed-forward comprehension and top-down production. Meanwhile, Grammar B is suppressed through mechanisms of inhibitory control, which prevents cross-linguistic interference and involuntary code-switching. The degree to which these languages are activated or inhibited may ultimately result in cross-linguistic transfer, but this is crucially not left to the grammar, but left to executive control.






---
##  Open Questions in Current L2 Frameworks

-   In general, L2 models &lt;small&gt;(SLM-r, PAM-L2, L2LP)&lt;/small&gt; explain how new L2 categories emerge from L1 categories or cue weightings, but do not offer integrated mechanisms for real-time category co-existence in **simultaneous bilinguals**.


-  They presume stable, homogeneous input, ignoring how **community-level input variability** (e.g., regional/accented speech) continuously reshapes sound categorization.

-  They assume prelexical perception directly dictates phonolexical encoding.

???
Now, when evaluating existing models of non-native and second language speech perception, such as the one presented, we encounter several theoretical limitations:

Model Scope: These models were primarily built to explain how an L2 emerges from an established L1 grammar. So, these parts of the models are fully developed and are more developed than the parts of the models where early bilingual grammars are explained. As we have seen, even though the L2LP speech model provides a mechanism to explain early bilingual grammars through inhibition and activation, those mechanisms seem to operate outside of the grammar itself and are attributed to general cognitive mechanisms. While this may be the case, it remains to be evaluated whether that is indeed so or whether an interaction between the two grammars occurs within the grammar itself as well.

Input Assumptions: Classic frameworks assume a stable, homogeneous input. In reality, however, specifically when we are talking about bilinguals that live in a situation of sustained bilingualism, they live in dynamic sociolinguistic environments that are characterized by high variability at the input level.Finally, these models assume a direct mapping between prelexical perception and phonolexical storage, where surface representations are passed directly onto underlying ones. Consequently, there is a carry-over from surface representations to phonolexical encoding—an assumption that must be evaluated across all contexts, as we will do in this presentation.   

---

## Sociolinguistic context in Catalonia (I)

&lt;img src="map.png" width="50%" style="display: block; margin: auto;" /&gt;

???

To evaluate these models empirically, we turn to the unique sociolinguistic context of Catalonia, where Catalan and Spanish are co-official languages in continuous contact. Since the 1980s, an educational immersion model ensures all children receive schooling in Catalan regardless of home language. This creates a highly bilingual population with rich, heterogeneous daily usage patterns spanning from strongly Catalan-dominant to strongly Spanish-dominant speakers.
---

## Sociolinguistic context in Catalonia (II)




&lt;img src="presentation_26102026_files/figure-html/habitual-1.svg" width="100%" /&gt;



???
Just to give you an idea, demographic survey data from the last 20 years regarding participants' habitual language of identification shows that Spanish remains the most common habitual language, representing approximately 46.5% of the population. Meanwhile, the proportion of speakers identifying Catalan as their habitual language has declined from 46% to 32%, alongside a slight increase in those reporting both languages as habitual.

So, we see that it is a complex reality, and young bilingual children grow up in an environment often characterized by non-canonical and accented community speech in Catalan.

## The Catalan Vowel System


&lt;img src="presentation_26102026_files/figure-html/vowel-space-scheme-1.svg" width="100%" /&gt;
???


Phonetically, Catalan has a 7-vowel system contrasting close-mid /e/ and open-mid /ɛ/. Spanish possesses a 5-vowel system with a single mid-front vowel category /e/. For Spanish-dominant bilinguals, acquiring and maintaining the Catalan /e/–/ɛ/ contrast requires establishing a new perceptual boundary within a region where Spanish has only one category.


---
# Input variability

&lt;img src="presentation_26102026_files/figure-html/unnamed-chunk-5-1.svg" width="100%" /&gt;



???

In real-world multilingual societies, bilinguals are rarely exposed solely to idealized monolingual input; instead, they are immersed in rich, variable input. For example, within the Catalan mid-vowel system, Spanish-dominant speakers may merge the Catalan /e/ and /ɛ/ vowels into a single close-mid vowel. Consequently, words canonically produced with an open-mid vowel—such as galeta—are realized with a close-mid vowel. Far from being isolated errors, these non-canonical realizations constitute an important portion of the input that new bilingual speakers receive.   


---

## Early exposure as a crucial factor for the mid vowel contrast
#### **Pallier, Bosch, &amp; Sebastián-Gallés (1997)**


**Catalan-Dominant** (n = 20): Raised by Catalan-speaking parents; exposed to Catalan from birth.

**Spanish-Dominant** (n = 20): Raised by Spanish-speaking parents; early intensive Catalan immersion started between ages 1–6 (mean age = 4.35 years).


.pull-left[

**Experiment 1: Identification Task**




&lt;small&gt;TasK: Listeners categorized each token as Pere (/e/) or pera (/ɛ/). &lt;/small&gt;



&lt;img src="presentation_26102026_files/figure-html/identification_curves-1.svg" width="80%" /&gt;


]


.pull-right[

**Experiment 2: AX Discrimination Task**



&lt;small&gt; Task: Button-press "Same / Different" discrimination.






&lt;img src="presentation_26102026_files/figure-html/unnamed-chunk-6-1.svg" width="100%" /&gt;
]

???

In a 1997 study, Pallier and colleagues examined Catalan-dominant bilinguals (raised by Catalan-speaking parents) and Spanish-dominant bilinguals (raised by Spanish-speaking parents) using an identification task and an AX discrimination task.   In the identification task, participants listened to mid-vowel tokens (such as peta [peɾə] vs. peta [pɛɾə]) and classified them as containing either the high-mid /e/ or low-mid /ɛ/ vowel. Results revealed a sharp boundary for Catalan-dominant bilinguals, whereas Spanish-dominant bilinguals showed a flat, non-categorical response pattern.   In the AX discrimination task, participants listened to pairs of stimuli along an acoustic continuum and determined whether the two sounds were the same or different. Catalan-dominant speakers demonstrated a sharp boundary between stimuli 3 and 5, reflecting a clear categorical perceptual boundary between /e/ and /ɛ/. In contrast, Spanish-dominant bilinguals showed no such categorical boundary, exhibiting flat discrimination accuracy across the continuum.   

---

## Early exposure as a crucial factor for the mid vowel contrast

#### **Ramon-Casas et al. (2023)**


* **Sample Size:** `\(N = 36\)` early bilingual preschoolers (M age = 4.5 years; range: 4;0–5;0).
* **Location:** 4 public immersion kindergartens in the Barcelona metropolitan area.
* **Catalan Exposure:** Intensive, continuous exposure (at least 5 days/week since age 3).



&lt;img src="presentation_26102026_files/figure-html/ramon-casas-dissociation-plot-1.svg" width="70%" /&gt;





]

???

A similar effect of language dominance was reported in a study by Ramon-Casas et al. (2023), who examined early bilingual preschoolers using an XAB discrimination task with control words, non-words, and real words, alongside assessing production accuracy.   In non-words, speakers performed at chance level, suggesting that the vowel contrast is more difficult to perceive in non-words than in real words. In real words, however, a clear dominance effect emerged, with Catalan-dominant bilinguals exhibiting higher perceptual accuracy than Spanish-dominant bilinguals. Regarding production, participants demonstrated higher accuracy for the high-mid vowel—which is present in the Spanish vowel system—alongside a dominance effect favoring Catalan-dominant bilinguals.

---

### Is contrast sensitivity reduced or enhanced depending on language mode?



* Spanish-dominant early bilinguals show reduced sensitivity to the /e/–/ɛ/ contrast in static XAB discrimination, whereas Catalan-dominant bilinguals exhibit robust category boundaries &lt;small&gt;(Pallier et al., 1997; Ramón-Casas et al., 2023)&lt;/small&gt;.


* Is prelexical sensitivity fixed, or does operating in a **Spanish language mode** temporarily attenuate boundary sharpness ($s$) versus maintaining cooperative co-activation without boundary flattening?


???

In sum, the literature provides a static snapshot based on single-session tasks. This leaves open a fundamental question, which we examine next: is this prelexical contrast fixed, or does operating in Spanish mode attenuate boundary sharpness for Catalan-dominant bilinguals? Conversely, does operating in Catalan mode trigger greater boundary sharpness for Spanish-dominant bilinguals?

## Is contrast sensitivity modulated by language mode?


* **Language mode**: the state of activation and availability of a bilingual's languages and processing mechanisms at any given point in time (Grosjean; 1982, 1998, 2001, 2008)


 * Perceptual categories in early bilinguals are not static; they shift dynamically based on real-time activation levels across communicative contexts &lt;small&gt;(Grosjean, 1998, 2008, 2020; Green &amp; Abutalebi, 2013)&lt;/small&gt;.

* When a contrast exists in **both** languages (e.g., VOT in /p/-/d/), bilinguals shift category boundaries between monolingual sessions to match target-language phonetic norms &lt;small&gt;(Elman et al., 1977; Flege &amp; Eefting, 1987; Garcia-Sierra et al., 2009; Gonzales &amp; Lotto, 2013)&lt;/small&gt;.

&lt;img src="presentation_26102026_files/figure-html/unnamed-chunk-7-1.svg" width="55%" /&gt;










  * Prior studies evaluated contrasts present in **both** systems (where overlapping categories trigger competitive top-down inhibition).
  


???

Language mode represents the state of activation and availability of a bilingual's languages and processing mechanisms at any given point in time. Prior literature demonstrates that perceptual categories in early bilinguals dynamically adapt to language mode. For example, let's tak Voice Onset Time. In English, voiceless stops have long-lag VOT and voiced stops have short-lag VOT. In Spanish, however, voiceless stops have short-lag VOT and voiced stops have negative VOT. And, what the literature has found is that listeners are more lkely to parse short-lag VOT as a voiced stop in English mode, but a voiceless stop in Spanish mode. So listeners shift their boundaries depending on language mode. 
However, previous studies have focused exclusively on contrasts present in both languages, showing that bilinguals can inhibit the non-informative system. This raises a fundamental theoretical question: What happens when a contrast exists in only one language, such as the Catalan mid-vowel contrast /e/–/ɛ/? Do listeners in Spanish mode deactivate the Catalan grammar capable of perceiving this contrast, or does the perceptual grammar remain active when there is no direct competition? 



---

## Research Questions

&gt; **RQ1**  
&gt; Do bilinguals show a less robust `\(/e-ɛ/\)` contrast (language-specific) than an `\(/i-e/\)` contrast (shared cross-linguistically)?


&gt; **RQ2**  
&gt; Does language mode dynamically modulate perceptual sensitivity to `\(/e-ɛ/\)`?


???

We addressed two core research questions:Contrast Robustness: Do bilinguals exhibit less robust encoding for the language-specific mid-vowel contrast (/e/–/ɛ/) than for a cross-linguistically shared baseline contrast (/i/–/e/)?   Dynamic Modulation: Does language mode dynamically modulate sensitivity to the /e/–/ɛ/ contrast? 
---

## Methodology: Design

.pull-left[
* **Discrimination task:**
  * 4 blocks of 24 AXB trials (96 trials per language mode session).
  * Tested across 2 sessions spaced at least 7 days apart.

* **Picture-Naming task:**
  * Prior to each 24-trial block, participants name 10 non-cognate pictures (to maintains activation of the target language mode throughout testing).
]

.pull-right[

* **Continuous Predictors:**
  1. **Dominance Index (BLP):** Ranging from strongly Catalan-dominant (&lt;0) to Spanish-dominant (&gt;0).
  2. **Formant Acuity Task:** Bottom-up sensory threshold along continuous F1/F2 space &lt;small&gt;(Saito et al., 2022)&lt;/small&gt;.
]

???

In this study, we tested bilinguals across two distinct sessions spaced at least seven days apart: one entirely in Catalan mode and one in Spanish mode. The primary experimental task was an AXB discrimination task, where participants listened to three stimuli and identified whether the middle stimulus was more similar to the first or the second. To maintain language mode activation throughout the session, participants completed a non-cognate picture-naming task prior to each block.   Language dominance was measured as a continuous metric via the Bilingual Language Profile (BLP). Additionally, formant acuity was assessed using a language-neutral psychoacoustic threshold task, measuring bottom-up sensory discrimination across continuous F1 and F2 acoustic space.


---

## Discussion 

* **Weakly encoded contrast:** Greatest boundary steepness (*s*) for /i/–/e/ than /e/–/ɛ/ → Mid-vowels are encoded less robustly encoded. 

**A universally weak contrast?** Mid-vowel distinctions rely on late-emerging tongue height features ([RTR]), representing the final vocalic contrasts specified in European Portuguese development (Fikkert, 2005; Fikkert &amp; Freitas, 2004, 2006).

???

To Summarize our findings: boundary steepness confirmed that the /e/–/ɛ/ contrast is less robustly encoded than the /i/–/e/ contrast. And this suggests that mid-vowels are encoded less robustly in Catalan. But this raises the question: is this a weakly universally encoded contrast, specifically because of the smaller distance between the two mid-vowels when compared to other vowels? This lower robustness for mid-vowels also aligns with developmental findings in European Portuguese, where /e/–/ɛ/ is among the last vocalic contrasts to emerge because it relies on late-developing tongue height features. This suggests that mid-vowel perceptual complexity may be a broader property of vowel systems rather than an exclusive feature of bilingualism. This remains to be tested; a natural next step here could be to test Portuguese speakers that are not in contact with Spanish.




---

## Discussion 


* **Adaptive perceptual gradiency:** Catalan dominance exerts a linear main effect across the continuum → Reflects **heightened within-category sensitivity** rather than a shifted boundary, enabling flexible mapping of Spanish-accented community input.



&lt;img src="presentation_26102026_files/figure-html/unnamed-chunk-15-1.svg" width="100%" /&gt;


???

Second, we found a Catalan dominance effect across the /e/–/ɛ/ continuum. This reflects heightened category sensitivity rather than a shifted boundary, because enhanced perception is observed across the entire continuum. What we think could be happening here is that because Catalan-dominant speakers are exposed to greater sources of Catalan, they are also exposed to an overlapping range in `\(F_1\)`—that is, Spanish-accented Catalan, where /ɛ/ vowels are produced more like /e/ (low-mid vowels produced like high-mid vowels). Therefore, some words canonically encoded with /ɛ/ are produced with high-mid /e/, resulting in an overlapping distribution. Catalan-dominant speakers need to develop a more gradient perception of the mid-vowel space to distinguish these overlapping ranges.



---

## Discussion 


* **Stability across language modes:** Boundary location (*x*₀) and steepness (*s*) remain invariant across Catalan and Spanish contexts → **Spanish mode does not suppress non-target categories**. But, in Catalan mode high acuity listeners have enhanced perception in [e]-like tokens (activating a denser mid-vowel space demands higher acoustic acuity.)





&lt;img src="biphon_coactivated_ggplot2-v2.png" width="88%" style="display: block; margin: auto;" /&gt;
???

Regarding our core question on language mode effects, results demonstrate overall stability across language modes in both category boundary location and boundary sharpness. This indicates that operating in Spanish mode does not suppress non-target phonemic categories when a contrast exists in only one of the bilingual's languages. Rather than deactivating the non-target system, the Catalan perceptual grammar remains active to process mid-vowel distinctions. Contrary to classical inhibition models, because the Spanish mid-vowel system contains only a single mid-vowel category and presents no direct competition, the Catalan perceptual grammar can remain active without causing processing conflicts. Furthermore, listeners with high acoustic acuity exhibited enhanced perceptual resolution for /e/-like tokens specifically when tested in Catalan mode. This interaction suggests that higher language activation in Catalan mode engages a perceptual grammar designed for a denser acoustic space, which differentiates /e/ and /ɛ/. Consequently, high sensory acuity provides greater perceptual advantage in a crowded mid-vowel space than in a less dense system like Spanish

### Phonolexical Encoding in Early Bilinguals

* L1 phonological transfer extends beyond acoustic perception into **phonolexical encoding**. Non-native contrasts which may be mapped onto a single L1 category (single-category assimilation) produce "fuzzy" or imprecise lexical representations in long-term memory.

- **BiPhon / L2LP Architecture**
  - The *lexicon builder* processes perceived surface forms (`/SF/`) to create underlying forms (`|UF|`).
  - Continuous mapping to a single surface category (e.g., `/e/` for both vowels) provides **no input evidence** to establish separate `|UF|` entries.

* However, empirical work shows that perception and lexical encoding can decouple, accurate prelexical discrimination does not guarantee distinct lexical encoding  &lt;small&gt;(Darcy et al., 2012, 2013; Darcy &amp; Rothgerber, 2020)&lt;/small&gt;.


???

Within a multilayer framework, a crucial question arises regarding how prelexical perceptual representations feed into phonolexical encoding—specifically, how lexical entries are constructed from surface categories derived from acoustic-phonetic features. Theoretical models predict that mapping a non-native contrast onto a single non-target category (e.g., mapping `\(/ɛ/\)` onto `\(/e/\)`) will yield fuzzy or imprecise lexical representations. This occurs because the lexical builder relies on surface forms as input to construct underlying representations; a perceptual grammar that maps both vowels to a single category like `\(/e/\)` provides no evidence to establish a distinct contrast in the lexicon.However, recent research indicates that speakers may possess robust prelexical perception yet still fail to establish distinct phonolexical categories.

---
### Lexical Encoding in Early Bilinguals


**Sebastián-Gallés, Echeverría, &amp; Bosch (2005)**


-/ɛ/ word: *galleda* ([gəʎɛðə], bucket) mispronounced as *[gəʎeðə]


-/e/ word: *ulleres* ([uʎeɾəs], glasses) mispronounced as *[uʎɛɾəs]

Control Condition: Distractors with non-problematic Spanish/Catalan sound changes (/e/ -&gt; /o/).





&lt;img src="presentation_26102026_files/figure-html/sebastian_galles-1.svg" width="80%" style="display: block; margin: auto;" /&gt;

???

This question can be evaluated using a lexical decision task, which directly tests knowledge at the phonolexical level by requiring participants to judge whether an auditory stimulus is a real word in the target language. Accepting mispronounced items in this task typically indicates that underlying target encoding is imprecise.Prior research by Sebastián-Gallés and colleagues in Catalan demonstrated that Spanish-dominant bilinguals frequently accept mispronunciations of real Catalan target words. Surprisingly, native Catalan-dominant bilinguals also show acceptance of these mispronunciations, despite possessing robust prelexical discrimination for the `\(/e/\text{--}/ɛ/\)` contrast.

Early Catalan-Dominant: Exposed to Catalan at birth; Spanish acquired early.

Early Spanish-Dominant: Exposed to Spanish at birth; intensive Catalan immersion ≤ 4 years.

Simultaneous Catalan-Dominant: Exposed to both from birth; Catalan-speaking mother.

Simultaneous Spanish-Dominant: Exposed to both from birth; Spanish-speaking mother.



---

### The lexical decision task bottleneck

&lt;img src="presentation_26102026_files/figure-html/biphon-mod-1.svg" width="100%" /&gt;


???
This finding introduces two competing theoretical accounts that cannot be disentangled by a standard lexical decision task alone:

Fuzzy / Dual-Target Storage: Bilinguals store two competing lexical representations for a word because they are uncertain of its true canonical vowel target.

Flexible / Surface Tolerance: Bilinguals store a single, fully specified canonical target in memory, but demonstrate online perceptual tolerance for non-canonical surface realizations due to ambient input variability in their speech community.

To disentangle these two theoretical possibilities, we implemented a novel task design in our next study—joint work with my colleagues at Universitat Pompeu Fabra, Miquel Llompart and Scott Perry.

---

## Multitask battery

&lt;img src="multitask_decision_tree.png" width="100%" /&gt;

???


As we've seen, relying on a single experimental task to map how bilinguals process phonological contrasts creates a bottleneck and is simply insufficient. Instead, we implement a three-task decision tree designed to systematically isolate four distinct phonological representation profiles—ranging from low-level acoustic perception to fully integrated lexical processing.

First, we ask: can the listener acoustically distinguish the mid-vowel contrast using a pre-lexical discrimination task? If they can't, that places them in our first profile: a merged mid-vowel category. Here, a Spanish-like perceptual filter collapses the contrast, treating /e/ and /ɛ/ as phonetically identical with no underlying distinction.

If there is acoustic discrimination at the pre-lexical level, we move to the next step and ask whether listeners prefer canonical forms of the mid-vowel in real words. If they don't, the listener has fuzzy lexical encoding—meaning they can discriminate the contrast in isolation, but fail to systematically specify it within long-term lexical entries. If they do prefer canonical forms, they've established contrasting underlying representations in their lexicon.

Next, we evaluate whether listeners reject mispronunciations of these canonical vowels in a lexical decision task. If they tolerate mispronunciations, they fall into the profile of flexible word recognition. They have robust lexical representations, but demonstrate tolerance for non-canonical forms—an adaptive strategy for navigating variable input within the speech community. Crucially, here we observe a clear directional asymmetry: listeners show much greater acceptance of /e/ mispronunciations for /ɛ/ target words than vice versa, directly mirroring community input where /ɛ/ is frequently realized as /e/.

Finally, if listeners do reject mispronunciations, they display our top profile: a fully integrated contrast. They hold accurate acoustic perception, specified underlying target representations, and productively leverage the contrast across lexical tasks.

## Multitask battery

| Level | Experimental Paradigm | Core Question |
| :--- | :--- | :--- |
| **1. Acoustic-perceptual ** | XAB Discrimination | Evaluates bottom-up, prelexical acoustic-phonetic discrimination |
| **2.1 Lexical encoding** | Lexical Decision | Examines whether acoustic-phonetic differences are functionally encoded into real-word representations stored in long-term memory |
| **2.2 Lexical encoding** | Lexical Preference |Disentangles underlying phonolexical representations from functional tolerance for accented speech.|
| **3. Learning** | Novel Word Learning | Assesses whether acoustic detail is retained for lexical storage under higher referential and cognitive load. |


Our multi-task battery decouples processing tiers across 3 tasks: XAB measures bottom-up prelexical discrimination; Lexical Decision tests online mispronunciation acceptance; Lexical Preference forces a 2-alternative choice to directly measure stored target fidelity (|UF|)
---

## Task: XAB Discrimination Task

.pull-left[
- **Target Trials (30):** Catalan mid-vowel minimal pairs
  * `/e/` vs. `/ɛ/` (e.g., *pem* [pem] – *pɛm* [pɛm])
- **Control Fillers (16):** Non-mid vowel contrasts
  * (e.g., *tis* [tis] – *tas* [tas])
- **Recording:** High-quality audio recorded with a Zoom H4n by a native Central Catalan speaker.
- **Timing:** Equal Inter-Stimulus Intervals (ISIs) between all presented sounds.

]

???
In our XAB task (Pre-lexical Discrimination), we tested whether bilinguals distinguish the /e/-/ɛ/ contrast using monosyllabic non-words like pem vs. pɛm, alongside filler controls like tis vs. tas. The task yielded 30 target trials and 16 fillers. To make it child-friendly, we gamified the setup: a teacher character produced a non-word, and children selected which of two prompt girls produced the sound most accurately

---
### Task 1: XAB Discrimination Performance


&lt;img src="presentation_26102026_files/figure-html/xab_combined-1.svg" width="100%" style="display: block; margin: auto;" /&gt;

???

Moving on to the results for Task 1, the XAB Discrimination Task, this figure illustrates individual participant accuracy across Filler and Experimental trials for both Children—shown in orange—and Adults, in purple.Looking first at the Filler trials on the left, we observe a clear ceiling effect across both age groups. This confirms that both children and adults fully understood the task instructions and could do the task. Looking at our model for the experimental trials ($N = 1406$), we observe a significant intercept ($\beta = 1.28$, `\(z = 5.72\)`, `\(p &lt; 0.001\)`), confirming that overall accuracy was significantly above chance. Crucially, there is a robust main effect of Group ($\beta = 1.73$, `\(z = 4.92\)`, `\(p &lt; 0.001\)`), indicating that adults achieved significantly higher accuracy and lower individual dispersion than children, even though both groups performed above chance overall.


---
## Task: Lexical Decision Task

- Does this word sound like a word in Catalan?
- **Design:** Three conditions (canonical vowel, difficult vowel swap, easy vowel swap) using a Latin square with 3 counterbalanced lists.
- **Trials:** 
  * 24 targets
  * 48 fillers (28 words, 20 pseudowords)

In Experiment 2, we used an auditory lexical decision task to examine whether participants accept non-canonical vowel realizations in Catalan words. We manipulated three conditions: real words containing the canonical vowel, easy vowel swaps where we changed the high mid vowel for the high vowel /i/ and the low mid vowel for the low vowel /a/, and the difficult swaps where we change the canonical mid vowel for the non-canonical mid vowel. Across 24 targets and 48 fillers using a Latin square design

---

### Task 2: Lexical Decision Task Accuracy



&lt;img src="presentation_26102026_files/figure-html/ld_combined-1.svg" width="100%" style="display: block; margin: auto;" /&gt;


???
First, in the Canonical condition, participants were presented with correctly pronounced real words. As you can see, both children and adults perform near ceiling—hovering between 88% and 96% accuracy across both open /ɛ/ and closed /e/ words. This high performance confirms that participants know these vocabulary items and hold well-specified target entries in long-term memory.   Second, in the Easy condition, target vowels were swapped with a distant, non-mid vowel—such as replacing /ɛ/ with /a/. Here again, accuracy remains extremely high for both age groups. This tells us that participants understand the task demands and easily reject clear, unambiguous phonetic violations.   However, when we turn to the Difficult condition—where target vowels are swapped with their adjacent mid-vowel counterpart—performance drops precipitously. Accuracy plummets well below the 50% chance line, falling to roughly 8% to 25%. Rather than rejecting these mid-vowel mispronunciations, listeners routinely accept them as valid real words.   Crucially, while adults maintain slightly higher baseline accuracy overall, both adults and children display the exact same profile: strong lexical knowledge and robust non-mid rejection, paired with a shared, online tolerance for mid-vowel substitutions.  


---

In the third experiment, a two-alternative forced-choice lexical preference task was conducted to determine whether participants demonstrate a systematic preference for canonical over non-canonical vowel realizations in Catalan words. On each trial, participants listened to two auditory variants of a word and indicated their preferred pronunciation.

To adapt the paradigm for children, the task was gamified: two animated female characters presented the two auditory tokens, and participants selected which character produced the Catalan word more faithfully.  The stimulus set comprised 24 target items, corresponding to the target words evaluated in the lexical decision experiment.
---
### Results Task 3: Lexical Preference Performance





&lt;img src="lp_combined_boxplot_noto.png" width="100%" /&gt;


???

Here we have the results for the Lexical Preference task. On the `\(x\)`-axis, we see the target word condition—whether items contain the canonical close-mid vowel `\(/e/\)` or the canonical open-mid vowel `\(/ɛ/\)`. The `\(y\)`-axis displays participant accuracy rates, with children represented in orange and adults in purple.At the group level, both children and adults perform above chance overall. However, notice the substantial individual variability specifically within the child cohort, where several children perform below the 50% chance line.Statistical modeling confirms two main effects:Effect of Group: Adults achieve significantly higher accuracy than children.Effect of Vowel Type: Words encoded with the close-mid vowel `\(/e/\)` are processed with greater robustness than words containing the open-mid vowel `\(/ɛ/\)`.

## Results Task 3: Adult Dominance Effects


&lt;img src="presentation_26102026_files/figure-html/unnamed-chunk-32-1.svg" width="100%" /&gt;


???

First, Lexical Decision (LD) shows no meaningful correlation with pre-lexical acoustic discrimination (XAB) in either group ($r = -0.01$ in children; `\(r = 0.08\)` in adults). This demonstrates that individuals—whether children or adults—who reject more vowel swaps do not do so simply because they possess higher acoustic-perceptual acuity. The ability to reject mispronunciations in real words operates independently from raw perceptual sensitivity, pointing to distinct higher-level lexical and task-demand mechanisms.   Second, we observe a consistent moderate positive correlation between pre-lexical discrimination (XAB) and Lexical Preference (LP) in both children ($r = 0.52$) and adults ($r = 0.40$). This indicates that sharper acoustic distinction at the perceptual level directly supports the establishment of well-specified, canonical phonolexical targets in long-term memory across age groups.   

---

# Discussion


* **Surface tolerance**: High mispronunciation acceptance in Lexical Decision reflects flexible online surface tolerance (/SF/) to variable community speech, rather than imprecise underlying representations. However, our results show quite a lot of variation at th individual level.
* **Input-driven parsing**: The directional asymmetry (accepting [e] for /ɛ/ targets) directly mirrors Spanish-accented input, demonstrating a parser that adapts to the variable input.


* **Catalan home input and language dominance** directly consolidate underlying representations against variable community speech across both mid-vowels. Being exposed to more input may mean higher probability that you hear input with the mid vowel contrast.

* There may be a higher threshold for input in phonolexical encoding than in prelexical discrimination because for the former speakers need word-by-word input.



???

Turning to our discussion on surface tolerance, coupling our lexical decision results with our lexical preference data demonstrates that the acceptance of vowel swaps—or mispronunciations—reflects online perceptual tolerance for Spanish-accented community input, rather than imprecise or "fuzzy" underlying representations in memory. Crucially, however, our data reveals substantial individual variation. In particular, children performed below chance in the lexical preference task, indicating that while these results reflect broad population trends, they do not apply identically across every individual speaker in our sample.Second, we observed a distinct directional asymmetry: speakers exhibit greater certainty regarding the phonolexical encoding of words containing the close-mid vowel `\(/e/\)` compared to those with the open-mid vowel `\(/ɛ/\)`. This directional bias directly mirrors ambient Spanish-accented community input, where `\(/ɛ/\)` tokens are frequently realized as `\([e]\)`.Third, Catalan home exposure and language dominance serve to consolidate underlying representations against variable community speech. A Catalan-dominant profile combined with higher home exposure increases the cumulative probability of encountering canonical mid-vowel tokens, thereby stabilizing long-term memory targets across both `\(/e/\)` and `\(/ɛ/\)`.Finally, our findings point toward a differential input threshold hypothesis between prelexical perception and phonolexical encoding. While prelexical acoustic discrimination can be established with lower overall input density, phonolexical target creation requires a significantly higher input threshold—demanding robust, word-by-word exposure across individual vocabulary items to fully consolidate fine-grained contrasts in long-term memory.

---

## Conclusions

## Conclusions

.conclusion-card.blue[
.card-title[⚡. Cooperative Co-Activation]
Language-asymmetric contrasts (e.g., Catalan /e/- ɛ/ vs. Spanish /e/) enable parallel co-activation **without category overlap** or top-down boundary suppression. Acoustic acuity further sharpens discrimination.
]

.conclusion-card.amber[
.card-title[ 2. Surface Tolerance vs. Memory Storage]
Lexical decision taps **surface-level perceptual tolerance** driven by community input, whereas paired lexical preference is required to uncover **intact underlying representations (URs)**.
]

.conclusion-card.green[
.card-title[ 3. Differential Input Thresholds]
Language dominance and exposure predict UR storage far better than prelexical perception—**phonolexical encoding requires a higher input threshold** than perceptual discrimination.
]


???

To conclude, our findings offer three key insights for modeling bilingual phonetics and phonology:   Parallel Coactivation of Perceptual Grammars: Results from Study 1 demonstrate parallel coactivation of dual perceptual grammars. This occurs when a contrast is present in one language but absent in the other, avoiding direct cross-linguistic competition. Theoretical architectures must incorporate mechanisms that account for this coactivation.   

Comparing lexical decision with lexical preference tasks reveals that speakers exhibit tolerance to variable ambient input. A standard lexical decision task alone is insufficient to reliably isolate underlying storage in bilinguals exposed to sustained variation. Comprehensive models must account for how speakers parse input variability and incorporate flexible surface-level mapping

Language dominance and cumulative exposure serve as stronger predictors of underlying phonolexical encoding than prelexical discrimination abilities alone. Crucially, future models must account for how differential input yields distinct effects across phonetic versus phonological levels of representation.
---
# Broader implications

&lt;img src="bilingual_model_integration_ggplot2.png" width="100%" /&gt;


???

- Bilingual phonetics-phonology models should integrate input variability, mechanism for grammar coactivation, and a mechanism to allow for fuzzy representations.

## Modeling Early Bilingual Sound Systems

- Early-established L1 cue weights act as a perceptual filter, collapsing distinct acoustic inputs into a single phonetic category space &lt;small&gt;(Flege, 1995; Flege &amp; Bohn, 2021)&lt;/small&gt;. 

&lt;img src="presentation_26102026_files/figure-html/slm-1.svg" width="100%" /&gt;




# Results: 4PL Nonlinear Modeling


Perceptual categorization curves were evaluated by fitting a 4PL logistic function:

`$$f(x) = a_1 + \frac{a_2 - a_1}{1 + e^{-s(x - c)}}$$`

- `\(a_1, a_2\)`: Lower and upper asymptotes (constrained within `\([0, 1]\)`).
- `\(c\)`: Crossover point (category boundary location).
- `\(s\)`: Boundary steepness/slope parameter (higher values = sharper perception).

&lt;img src="presentation_26102026_files/figure-html/unnamed-chunk-35-1.svg" width="80%" /&gt;

???
What we did to examine these results statistically is we calculated the crossover point—so where is the boundary for each speaker—and what is the boundary sharpness. To do this, we estimated floor and ceiling performance for each listener, which allowed us to mathematically isolate boundary location from boundary sharpness.


---

# Results: Crossover Point

&lt;img src="presentation_26102026_files/figure-html/unnamed-chunk-36-1.svg" width="100%" /&gt;

???
We will first look at the category boundary location. Linear mixed-effects modeling revealed that boundary position remained completely stable across language modes. So, when we compare the position across the steps, operating in Spanish mode did not shift the perceptual boundary, neither for /e/–/ɛ/ (which is the target contrast) nor /i/–/e/ (which is the control contrast).



---

# Results: Boundary Sharpness

Category boundary sharpness was significantly shallower for the target /e/–/ɛ/ contrast compared to the baseline /i/–/e/ contrast (b = -3.80, p &lt; .001).

&lt;img src="presentation_26102026_files/figure-html/unnamed-chunk-37-1.svg" width="80%" /&gt;
???
What about boundary sharpness? What you see in this graph is an individual-level breakdown of slope differences, calculated by subtracting the slope of the curve between /i/–/e/ from /e/–/ɛ/. The central dashed line represents zero, meaning identical boundary steepness for both contrasts. Notice how the plot is overwhelmingly dominated by orange bars extending to the left. This shows that bilinguals in our sample maintain a much sharper categorical transition for the shared /i/–/e/ baseline than for the mid-vowel contrast. Crucially, when we examine these individual slopes across language modes, operating in a Spanish context does not flatten or attenuate this boundary steepness.


---

"Turning to individual differences within our child cohort, we modeled how developmental age and cumulative Catalan home exposure shape performance across the task battery. The two top panels display significant developmental age effects, drawn with solid lines, while the two bottom panels show marginal trends for home exposure, drawn with dashed lines.Looking first at Panel A, in Task 1 (XAB Discrimination), we find a significant Age by Trial Type interaction ($p = .049$). As children grow older—from age 7.5 to 10.4 years—their ability to discriminate acoustic mid-vowel contrasts improves significantly, widening the accuracy gap between experimental mid-vowel pairs and control fillers. This demonstrates that bottom-up acoustic acuity undergoes continuous maturation across middle childhood.Moving to Panel B, in Task 3 (Lexical Preference), we observe a strong Age by Target Vowel interaction ($p = .005$). Older children display significantly higher accuracy in choosing the canonical target over its mispronunciation, particularly for target /e/ words. This confirms that phonolexical target fidelity in long-term memory ($|UF|$) becomes increasingly robust and specified as children mature.When we examine language experience in Panel C, Catalan home exposure shows a strong marginal main effect on Lexical Preference ($p = .051$). Children who hear and use more Catalan in the home exhibit higher accuracy in choosing canonical word targets in forced choice.Finally, in Panel D, in Task 2 (Lexical Decision), home exposure marginally interacts with task condition ($p = .062$), showing that rich Catalan input at home helps children navigate the difficult mid-vowel swap condition.To synthesize these individual effects: Age drives the structural maturation of both bottom-up perceptual discrimination and stored target representations ($|UF|$), while cumulative home input provides the essential exposure needed to refine target fidelity and online processing strategies."*

### Category Boundary Location (c) and Steepness (s) Remain Invariant Across Modes

.pull-left[
* **4PL Model:** `\(f(x) = a_1 + \frac{a_2 - a_1}{1 + e^{-s(x - c)}}\)`
* **Boundary Location (c):** No significant shift across Catalan vs. Spanish modes ($p = .826$).
* **Boundary Steepness (s):** /e/–/ɛ/ is less steep than /i/–/e/ ($b = -3.80, p &lt; .001$), but slope `\(s\)` is unaffected by language mode ($p = .826$) or dominance ($p = .248$).
]

.pull-right[
&lt;img src="presentation_26102026_files/figure-html/category-1.svg" width="100%" /&gt;

]


???

To evaluate perceptual processing with mathematical rigor, we deployed a two-tier analytic strategy: 4-parameter logistic models to isolate categorical boundaries, and Generalized Additive Mixed Models to trace trial-by-trial within-category sensitivity1.At the macro level, 4PL fits revealed that category boundary remained invariant across modes.

For boundary sharpness (s), our 4-parameter logistic linear mixed-effects model revealed that category sharpness was significantly greater for the control /i/–/e/ contrast than for the target mid-vowel /e/–/ɛ/ contrast (b = -3.80, p &lt; .001).
As shown in this individual-level slope breakdown on the right—where negative orange bars indicate steeper slopes for /i/–/e/—virtually every single bilingual in our sample exhibited a significantly sharper, more categorical boundary transition for the baseline control contrast compared to the more vulnerable mid-vowel contrast.
Crucially for our second research question, however, operating in Spanish language mode did not attenuate or flatten this boundary steepness (p = .826), nor was boundary sharpness modulated by continuous language dominance (p = .248)."
